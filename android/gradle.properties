org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# Incremental Kotlin can report success without emitting SharedPreferencesPlugin.class.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# Flutter 3.38 still uses the legacy AGP DSL and Kotlin Gradle Plugin.
android.newDsl=false
android.builtInKotlin=false
